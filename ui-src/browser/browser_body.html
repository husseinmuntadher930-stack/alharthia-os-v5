<div id="br">
  <header id="topbar">
    <div class="tb-start">
      <button class="tb-btn" data-br="home"><svg class="i" data-i="home"></svg><span>الرئيسية</span></button>
      <button class="tb-btn" data-br="apps"><svg class="i" data-i="apps"></svg><span>التطبيقات</span></button>
      <span id="tbTitle">Chromium</span>
    </div>
    <div id="tbClock"></div>
    <div class="tb-end">
      <button class="tb-btn" id="tbKbd" data-br="kbd" title="كيبورد الشاشة"></button>
      <span class="status-group">
        <span class="tb-btn"><svg class="i" data-i="bluetooth"></svg></span>
        <span class="tb-btn" id="brWifi"><svg class="i" data-i="wifi"></svg></span>
        <span class="tb-btn"><svg class="i" data-i="vol"></svg></span>
      </span>
    </div>
  </header>
  <div class="btabs" id="brTabs"></div>
  <div class="bchrome">
    <button class="icon-btn" data-br="back" id="brBack" title="رجوع"><svg class="i" data-i="chevR"></svg></button>
    <button class="icon-btn" data-br="fwd" id="brFwd" title="تقدّم"><svg class="i" data-i="chevL"></svg></button>
    <button class="icon-btn" data-br="reload" id="brReload" title="تحديث"><svg class="i" data-i="restart"></svg></button>
    <form class="url" id="brForm" autocomplete="off"><span id="brLock"><svg class="i" data-i="lock"></svg></span><input type="text" id="urlIn" placeholder="اكتب عنوان موقع أو ابحث" spellcheck="false" autocapitalize="off"></form>
    <button class="icon-btn" data-br="zoomOut" title="تصغير"><svg class="i" data-i="zoomOut"></svg></button>
    <button class="icon-btn" data-br="zoomIn" title="تكبير"><svg class="i" data-i="zoomIn"></svg></button>
    <button class="icon-btn" data-br="full" title="ملء الشاشة"><svg class="i" data-i="fit"></svg></button>
  </div>
  <div id="brProg"><i></i></div>
  <div id="brPanel" hidden>
    <div class="brp-in">
      <div class="quick" id="brQuick"></div>
      <div class="nt-recent" id="brSug"></div>
    </div>
  </div>
</div>
