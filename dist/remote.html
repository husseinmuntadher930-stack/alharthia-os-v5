<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ريموت AlharthiaOS</title>
<style>
:root{--acc:#f0703e;--bg:#0a1228;--bg2:#101c3d;--card:#16254d;--card2:#1d2f5e;--line:rgba(255,255,255,.1);--text:#f1f5ff;--mut:#93a6cf;--ok:#22c55e;--bad:#ef4444;--teal:#2dd4bf;
  --font:"IBM Plex Sans Arabic","Noto Sans Arabic UI","Noto Sans Arabic","DejaVu Sans",sans-serif;--osk-h:0px;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input{font:inherit}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
[hidden]{display:none!important}
#osk{position:fixed;left:0;right:0;bottom:0;z-index:150;--kb-bg:#e3e6eb;--kb-key:#fff;--kb-fn:#cfd4dc;--kb-t:#1b1f27;--kb-t2:#5b6475;background:var(--kb-bg);padding:4px 8px 10px;touch-action:none;-webkit-user-select:none;user-select:none;box-shadow:0 -4px 18px rgba(0,0,0,.12);font-family:var(--font)}
html[data-theme=dark] #osk,#osk.dk{--kb-bg:#1c1d21;--kb-key:#3a3b40;--kb-fn:#2a2b30;--kb-t:#eceef2;--kb-t2:#a3a9b6}
.osk-s{--kh:44px;--kg:6px}.osk-m{--kh:58px;--kg:7px}.osk-l{--kh:72px;--kg:9px}
.osk-bar{display:flex;align-items:center;gap:6px;height:46px;padding:0 2px;max-width:1400px;margin:0 auto}
.osk-bar .grow{flex:1}
.ob{width:46px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:22px;color:var(--kb-t2)}
.ob:active,.ob.on{background:var(--kb-fn)}
.osk-langs{display:flex;gap:4px}
.ol{height:34px;padding:0 14px;border-radius:99px;font-weight:600;font-size:14px;color:var(--kb-t2)}
.ol.on{background:var(--acc);color:#fff}
.osk-keys{display:flex;flex-direction:column;gap:var(--kg);max-width:1400px;margin:0 auto}
.osk-row{display:flex;gap:var(--kg);justify-content:center}
#osk .k{flex:1 1 0;min-width:0;max-width:calc(var(--kh)*1.6);height:var(--kh);border-radius:10px;background:var(--kb-key);color:var(--kb-t);font-size:calc(var(--kh)*.42);font-weight:500;box-shadow:0 1px 0 rgba(0,0,0,.2);display:grid;place-items:center;position:relative;font-family:var(--font);padding:0}
#osk .k svg{font-size:calc(var(--kh)*.44)}
#osk .k.fn{background:var(--kb-fn);font-size:calc(var(--kh)*.3);font-weight:600}
#osk .k.w15{flex-grow:1.5;max-width:calc(var(--kh)*2.4)}
#osk .k.space{flex-grow:5.5;max-width:none;font-size:calc(var(--kh)*.26);color:var(--kb-t2)}
#osk .k.enter{background:var(--acc);color:#fff}
#osk .k.on{background:color-mix(in srgb,var(--acc) 30%,var(--kb-fn))}
#osk .k.lock{background:var(--acc);color:#fff}
#osk .k.down{background:var(--kb-fn)}
#osk .k.has-alt::after{content:"";position:absolute;top:6px;left:7px;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.35}
.osk-pop{position:absolute;transform:translate(-50%,calc(-100% - 8px));min-width:60px;height:76px;padding:0 12px;border-radius:16px;background:var(--kb-key);color:var(--kb-t);box-shadow:0 8px 22px rgba(0,0,0,.28);display:grid;place-items:center;font-size:36px;pointer-events:none;z-index:2}
.osk-alt{position:absolute;display:flex;gap:4px;padding:6px;border-radius:16px;background:var(--kb-key);box-shadow:0 10px 28px rgba(0,0,0,.32);z-index:3}
#osk .osk-alt .k{width:var(--kh);flex:none;box-shadow:none;background:var(--kb-fn)}
#osk .osk-alt .k.hot{background:var(--acc);color:#fff}
.osk-emoji{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:2px;height:calc(var(--kh)*3 + var(--kg)*2 - 22px);overscroll-behavior:contain;overflow-y:auto;margin-bottom:var(--kg)}
#osk .osk-emo-t{height:22px;font-size:12px;font-weight:600;opacity:.65;padding:0 6px;display:flex;align-items:center;gap:8px}
#osk .osk-emo-clr{border:0;background:none;color:inherit;text-decoration:underline;font:inherit;cursor:pointer}
#osk .osk-emo-empty{grid-column:1/-1;align-self:center;text-align:center;opacity:.6;font-size:15px}
#osk .osk-emo-cats .k.ec{font-size:20px;background:transparent;box-shadow:none;min-width:0;padding:0;opacity:.6}
#osk .osk-emo-cats .k.ec.on{opacity:1;background:var(--kf,rgba(128,128,128,.2))}
#osk .osk-emoji .k.has-alt::after{content:none}
#osk .osk-emoji .k{font-family:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif;max-width:none;font-size:28px;background:transparent;box-shadow:none}
#osk .osk-xrow{max-width:1400px;margin:0 auto var(--kg)}
#osk .osk-xrow .k{height:calc(var(--kh)*.72);font-size:calc(var(--kh)*.26);max-width:none}
#tbKbd.off{opacity:.45}
.st-wifi .wf path{transition:opacity .2s}
@media (max-width:760px){.osk-m,.osk-l{--kh:46px;--kg:5px}.ol{padding:0 8px}}
html.lang-en{--font:"IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif}

#osk{z-index:50}
/* ---------- layout ---------- */
#app{position:fixed;inset:0;bottom:var(--osk-h);display:grid;grid-template-rows:46px 1fr 62px}
header{display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--bg2);border-bottom:1px solid var(--line)}
header .dot{width:10px;height:10px;border-radius:50%;background:var(--bad);box-shadow:0 0 10px var(--bad);flex:none}
header .dot.on{background:var(--ok);box-shadow:0 0 10px var(--ok)}
header .ttl{font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .ttl b{color:var(--acc)}
header .scr{color:var(--mut);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
header .les{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--card);white-space:nowrap}
header .les.warn{background:#7c2d12;color:#fed7aa}
header .clk{font-weight:800;font-size:16px;direction:ltr}
.rotb{width:38px;height:38px;border-radius:11px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.rotb svg{font-size:21px}
.rotb:active{background:var(--card2)}
#pairRot{position:fixed;top:12px;left:12px;z-index:5}
/* ---------- الاتجاه العمودي: نلف الصفحة كلها (اللمس يلف وياها) ---------- */
html[data-rot] body{position:fixed!important;top:0;left:0;width:100vh!important;height:100vw!important;transform-origin:0 0}
html[data-rot="90"] body{transform:translateX(100vw) rotate(90deg)}
html[data-rot="270"] body{transform:translateY(100vh) rotate(-90deg)}
html[data-rot] .grid{grid-template-columns:repeat(2,1fr);grid-template-rows:none;grid-auto-rows:1fr}
html[data-rot] .pick{grid-column:span 2}
html[data-rot] .grid .wide{grid-column:span 2}
html[data-rot] .padwrap{inset:8px 8px 74px 8px}
html[data-rot] .side{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:58px;flex-direction:row}
html[data-rot] #pair{grid-template-columns:1fr;align-content:center}
html[data-rot] header .scr{display:none}
html[data-rot] header .ttl{flex:1}
main{position:relative;overflow:hidden}
.tab{position:absolute;inset:0;padding:10px 12px;overflow:auto}
nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--bg2);border-top:1px solid var(--line)}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:600;color:var(--mut)}
nav button svg{font-size:23px}
nav button.on{color:var(--acc)}
/* ---------- home ---------- */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;height:calc(100% - 14px);grid-template-rows:1.2fr 1fr 1fr 1fr}
.tile{background:var(--card);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:15px;border:1px solid var(--line);position:relative;min-height:0}
.tile svg{font-size:30px}
.tile:active{transform:scale(.97);background:var(--card2)}
.tile.acc{background:linear-gradient(160deg,#ff8a4c,#e2582a);border:0}
.tile.wide{grid-column:span 2}
.tile.voice{background:linear-gradient(160deg,#0f766e,#115e59);border:0;overflow:hidden;padding:4px 8px}
.tile.voice span{font-size:14px}
.tile.voice .vlast{font-size:12px;font-weight:500;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tile.voice.live{background:linear-gradient(160deg,#dc2626,#991b1b)}
.tile.voice.paused{background:var(--card);border:1px solid var(--line)}
.rotb.mic.on{color:#4ade80}
.rotb.mic.speech{color:#fff;background:#dc2626;border-color:#f87171;animation:micp 1s infinite}
.rotb.mic.off{color:var(--mut)}
@keyframes micp{50%{box-shadow:0 0 0 6px rgba(239,68,68,.3)}}
.tile.hz{flex-direction:row;gap:10px}
.tile.hide{display:none}
/* ---------- الفلاشة ---------- */
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;gap:3px;flex:none}
.seg button{padding:8px 14px;border-radius:9px;font-weight:700;font-size:14px;color:var(--mut);display:flex;align-items:center;gap:6px}
.seg button.on{background:var(--acc);color:#fff}
.seg svg{font-size:17px}
.prog{position:fixed;left:12px;right:12px;bottom:calc(var(--osk-h) + 70px);background:#0b1636;border:1px solid var(--line);border-radius:14px;padding:10px 14px;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.prog b{display:block;font-size:14px;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog i{display:block;height:8px;border-radius:4px;background:var(--card);overflow:hidden}
.prog i::after{content:"";display:block;height:100%;width:var(--p,0%);background:var(--acc);transition:width .3s}
.sheet{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.sheet .btn{justify-content:center;padding:14px}
.tile.dis{opacity:.4;pointer-events:none}
.pick{grid-column:span 2;grid-row:span 1;background:linear-gradient(160deg,#1f3b80,#13265a);flex-direction:row;gap:14px;padding:0 16px;justify-content:flex-start}
.pick .nm{font-size:22px;font-weight:800;line-height:1.2;text-align:right;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.pick small{display:block;font-size:13px;color:var(--mut);font-weight:600}
.pick .dice{width:62px;height:62px;border-radius:16px;background:var(--acc);display:grid;place-items:center;flex:none}
.pick .dice svg{font-size:34px}
.pgline{font-size:13px;color:var(--mut);font-weight:600}
/* ---------- write / pointer ---------- */
.padwrap{position:absolute;inset:8px 74px 8px 8px;display:flex;align-items:center;justify-content:center}
.pad{position:relative;background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);touch-action:none;overflow:hidden}
.pad.dark{background:#122;}
.pad canvas{position:absolute;inset:0;width:100%;height:100%}
.pad.ptr{background:repeating-linear-gradient(0deg,transparent 0 39px,rgba(255,255,255,.06) 39px 40px),repeating-linear-gradient(90deg,transparent 0 39px,rgba(255,255,255,.06) 39px 40px),#0d1733;border:2px dashed rgba(255,255,255,.18)}
.pad .hint{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);font-size:16px;font-weight:600;pointer-events:none;text-align:center;padding:20px}
.side{position:absolute;top:8px;bottom:8px;right:8px;width:58px;display:flex;flex-direction:column;gap:7px}
.side button{flex:1;min-height:0;border-radius:14px;background:var(--card);display:grid;place-items:center;border:2px solid transparent}
.side button svg{font-size:24px}
.side button.on{border-color:var(--acc)}
.side .sw{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.6)}
/* ---------- files / tasks ---------- */
.bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.bar .path{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:12px;background:var(--card);font-weight:700;font-size:15px;border:1px solid var(--line)}
.btn.pri{background:var(--acc);border:0}
.btn svg{font-size:19px}
.list{display:flex;flex-direction:column;gap:7px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border-radius:14px;border:1px solid var(--line);font-size:16px;font-weight:600}
.row:active{background:var(--card2)}
.row .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--card2)}
.row .ic svg{font-size:21px}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--mut);font-weight:500;font-size:13px}
.row.done .nm{text-decoration:line-through;color:var(--mut)}
.chk{width:30px;height:30px;border-radius:9px;border:2px solid var(--mut);display:grid;place-items:center;flex:none}
.row.done .chk{background:var(--ok);border-color:var(--ok)}
.empty{text-align:center;color:var(--mut);padding:30px 10px;font-size:16px}
.field{flex:1;height:46px;border-radius:12px;border:1px solid var(--line);background:#0b1636;color:var(--text);padding:0 14px;font-size:16px;outline:none;min-width:0}
.field:focus{border-color:var(--acc)}
/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;bottom:var(--osk-h);background:rgba(4,8,20,.88);display:flex;align-items:center;justify-content:center;z-index:30;padding:14px}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:18px 20px;width:min(560px,100%);max-height:100%;overflow:auto}
.box h2{margin:0 0 6px;font-size:21px}
.box p{margin:0 0 12px;color:var(--mut)}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 12px}
.roles button{padding:14px 6px;border-radius:16px;background:var(--card);border:2px solid transparent;font-weight:800;font-size:17px;display:flex;flex-direction:column;align-items:center;gap:6px}
.roles button.on{border-color:var(--acc)}
.roles button svg{font-size:28px}
.err{color:#fca5a5;font-weight:700;min-height:22px;margin:4px 0}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
#toast{position:fixed;left:50%;top:56px;transform:translateX(-50%);background:#0b1636;border:1px solid var(--line);padding:10px 18px;border-radius:999px;font-weight:700;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.4);white-space:nowrap}
#note{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(124,45,18,.94);flex-direction:column;gap:14px;text-align:center;padding:20px}
#note b{font-size:30px}
#note span{font-size:18px;opacity:.85}
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s;z-index:80}
/* ---------- pairing ---------- */
#pair{position:fixed;inset:0;bottom:var(--osk-h);display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:18px;align-items:center;background:radial-gradient(120% 90% at 30% 20%,#13265a 0%,#0b1430 60%,#060b1a 100%)}
#pair .brand{font-size:30px;font-weight:900;margin-bottom:6px}
#pair .brand b{color:var(--acc)}
#pair .pins{display:flex;gap:8px;direction:ltr;margin:14px 0}
#pair .pins i{width:46px;height:58px;border-radius:12px;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:28px;font-weight:800}
#pair .pins i.cur{border-color:var(--acc)}
.num{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;direction:ltr}
.num button{height:62px;border-radius:14px;background:var(--card);font-size:26px;font-weight:800;border:1px solid var(--line)}
.num button:active{background:var(--card2)}
.num button.ok{background:var(--acc);border:0}
</style>
</head>
<body>
<div id="pair" hidden>
  <button class="rotb" id="pairRot" title="تدوير الشاشة"><svg class="i" data-i="rotate"></svg></button>
  <div>
    <div class="brand">Alharthia<b>OS</b> · الريموت</div>
    <p style="color:var(--mut);margin:0;font-size:16px;line-height:1.6">من الصبورة: <b style="color:var(--text)">الإعدادات ← الريموت ← ربط ريموت جديد</b><br>واكتب الرمز الي يطلع على الصبورة.</p>
    <div class="pins" id="pins"></div>
    <div class="err" id="pairErr"></div>
  </div>
  <div class="num" id="num"></div>
</div>

<div id="app" hidden>
  <header><span class="dot" id="dot"></span><span class="ttl">Alharthia<b>OS</b></span><span class="scr" id="scr"></span>
    <span class="les" id="les" hidden></span><span class="clk" id="clk"></span><button class="rotb mic" id="micInd" hidden title="المايك"></button><button class="rotb" id="rotBtn" title="تدوير الشاشة"><svg class="i" data-i="rotate"></svg></button></header>
  <main>
    <section class="tab" data-tab="home"></section>
    <section class="tab" data-tab="write" hidden></section>
    <section class="tab" data-tab="ptr" hidden></section>
    <section class="tab" data-tab="files" hidden></section>
    <section class="tab" data-tab="tasks" hidden></section>
  </main>
  <nav id="nav">
    <button data-go="home" class="on"><svg class="i" data-i="home"></svg>الرئيسية</button>
    <button data-go="write"><svg class="i" data-i="pen"></svg>الكتابة</button>
    <button data-go="ptr"><svg class="i" data-i="laser"></svg>المؤشر</button>
    <button data-go="files"><svg class="i" data-i="folder"></svg>الملفات</button>
    <button data-go="tasks"><svg class="i" data-i="check"></svg>المهام</button>
  </nav>
</div>
<div id="toast" hidden></div>
<div id="note" hidden></div>
<div id="dim"></div>

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICONS={
users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>',
attend:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="m9 13 2 2 4-4"/>',
dice:'<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.2" fill="currentColor"/><circle cx="15" cy="15" r="1.2" fill="currentColor"/><circle cx="15" cy="9" r="1.2" fill="currentColor"/><circle cx="9" cy="15" r="1.2" fill="currentColor"/>',
home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h5v-6h4v6h5V9.5"/>',
apps:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
store:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
board:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8"/><path d="m7 12 3-3 2 2 4-4"/>',
pdf:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/>',
doc:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
word:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="m8 12 1.5 6 2.5-5 2.5 5 1.5-6"/>',
table:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/>',

    if(key==='#space') return this.spaceDown(e,b);
    if(key.startsWith('#x-')&&this.sink()){ const k=key.slice(3); this.extKey(k); if(/Left|Right|Up|Down/.test(k)){ this.repT=setTimeout(()=>{ this.rep=setInterval(()=>this.extKey(k),70); },420); } return; }
    if(key.startsWith('#')) return this.fn(key,b);
    // character key: preview + long press alternatives
    const L=OSK_LANGS[this.lang];
    let alts=null;
    if(b.dataset.emo){ if(OSK_TONE_BASE.has(key)) alts=oskTones(key).slice(1); }
    else if(this.page==='abc'){ const obj=L.rows.flat().find(x=>typeof x==='object'&&x.k===key); alts=obj?obj.alt:(L.long&&L.long[key]); }
    this.popShow(b,this.labelFor(key));
    let longDone=false;
    if(alts){ this.lpT=setTimeout(()=>{ longDone=true; this.popHide(); this.openAlt(b,alts); },380); }
    const commit=ev=>{ removeEventListener('pointerup',commit,true); if(!longDone&&ev.type==='pointerup') this.type(this.labelFor(key)); };
    addEventListener('pointerup',commit,true);
  },
  labelFor(key){
    const L=OSK_LANGS[this.lang];
    if(this.page==='abc'&&this.shift){ if(L.shift&&L.shift[key]) return L.shift[key]; return key.toUpperCase(); }
    if(this.page==='sym1'&&/^\d$/.test(key)&&this.lang==='ar'&&S.ar) return AR_D[key];
    return key;
  },
  fn(key,b){
    switch(key){
      case '#hide': this.hide(); if(this.target) this.target.blur(); return;
      case '#shift': { const now=Date.now(); if(!this.shift){ this.shift=1; this.shiftT=now; } else if(this.shift===1&&now-this.shiftT<400) this.shift=2; else this.shift=0; this.render(); return; }
      case '#sym1': this.page='sym1'; this.render(); return;
      case '#sym2': this.page='sym2'; this.render(); return;
      case '#abc': this.page='abc'; this.render(); return;
      case '#emoji': this.page=this.page==='emoji'?'abc':'emoji'; this.emoCat=null; this.render(); return;
      case '#emocat': this.emoCat=b.dataset.c; this.render(); return;
      case '#emoclear': S.emojiRecent=[]; save(); this.render(); return;
      case '#lang': { const l=this.enabledLangs(); this.setLang(l[(l.indexOf(this.lang)+1)%l.length]); return; }
      case '#setlang': this.setLang(b.dataset.l); return;
      case '#enter': return this.enter();
      case '#m-ctrl': case '#m-alt': { const m=key.slice(3); this.mods.has(m)?this.mods.delete(m):this.mods.add(m); this.render(); return; }
      case '#settings': { const t=this.target; this.hide(); if(t) t.blur(); go('settings','time'); return; }
    }
  },
  toggleEnabled(){ S.oskMode=S.oskMode==='off'?'auto':'off'; save(); if(S.oskMode==='off') this.hide(); this.syncBtn(); toast(S.oskMode==='off'?'كيبورد الشاشة: مطفأ':'كيبورد الشاشة: يشتغل'); if(window.Native&&Native.on) Native.pushKbd(); },
  syncBtn(){ const b=document.getElementById('tbKbd'); if(!b) return; b.hidden=S.oskTopBtn===false; b.classList.toggle('off',S.oskMode==='off'); b.innerHTML=icon(S.oskMode==='off'?'keyboardOff':'keyboard'); },
  setLang(l){ this.lang=l; S.kbdLang=l; save(); this.page='abc'; this.shift=0; this.render(); },
  spaceDown(e,b){
    const x0=e.clientX; let moved=false, acc=0;
    const mv=ev=>{ const dx=ev.clientX-x0-acc; if(Math.abs(dx)>=18){ const n=Math.trunc(dx/18); acc+=n*18; moved=true; this.moveCaret(n); } };
    const up=()=>{ removeEventListener('pointermove',mv,true); removeEventListener('pointerup',up,true); if(!moved) this.type(' '); };
    addEventListener('pointermove',mv,true); addEventListener('pointerup',up,true);
  },
  /* ---------- editing primitives ---------- */
  live(){ const t=this.target; if(!t||!t.isConnected) return null; if(document.activeElement!==t) t.focus({preventScroll:true}); return t; },
  type(txt){
    if(this.page==='emoji'&&!/^#/.test(txt)){ S.emojiRecent=[txt,...(S.emojiRecent||[]).filter(x=>x!==txt)].slice(0,32); save(); }
    const sk=this.sink();
    if(sk){
      if(this.target&&this.target.alhSink&&document.activeElement!==this.target) this.target.focus({preventScroll:true});
      if(this.mods.size){ sk.combo([...this.mods],txt.toLowerCase()); this.mods.clear(); this.render(); }
      else sk.text(txt);
      this.extBuf=((this.extBuf||'')+txt).slice(-4);
      if(this.shift===1){ this.shift=0; this.render(); }
      else if(this.page==='abc'&&this.lang!=='ar'&&/[.!?]\s$/.test(this.extBuf)){ this.shift=1; this.render(); }
      return;
    }
    const t=this.live(); if(!t) return;
    if(t.isContentEditable){ document.execCommand('insertText',false,txt); }
    else if(t.type==='number'){ t.value=(t.value||'')+String(txt).replace(/[٠-٩]/g,d=>AR_D.indexOf(d)); t.dispatchEvent(new Event('input',{bubbles:true})); }
    else { const s=t.selectionStart??t.value.length, en=t.selectionEnd??s;
      if(t.maxLength>0&&t.value.length-(en-s)+txt.length>t.maxLength) return;
      t.setRangeText(txt,s,en,'end'); t.dispatchEvent(new InputEvent('input',{bubbles:true,data:txt,inputType:'insertText'})); }
    if(this.shift===1){ this.shift=0; this.render(); }
    else if(this.page==='abc'&&this.lang!=='ar'&&/[.!?]\s$/.test(this.textBefore())) { this.shift=1; this.render(); }
  },
  textBefore(){ const t=this.target; if(!t) return ''; if(t.isContentEditable) return ''; try{ return t.value.slice(0,t.selectionStart||0); }catch(e){ return t.value||''; } },
  extKey(k){ const sk=this.sink(); if(!sk) return; if(this.mods.size){ sk.combo([...this.mods],k,true); this.mods.clear(); this.render(); } else sk.key(k); if(k==='BackSpace') this.extBuf=(this.extBuf||'').slice(0,-1); },
  back(){
    if(this.sink()) return this.extKey('BackSpace');
    const t=this.live(); if(!t) return;
    if(t.isContentEditable){ document.execCommand('delete'); return; }
    if(t.type==='number'){ t.value=String(t.value).slice(0,-1); t.dispatchEvent(new Event('input',{bubbles:true})); return; }
    let s=t.selectionStart, en=t.selectionEnd;
    if(s===en){ if(!s) return; const before=t.value.slice(0,s); const ch=Array.from(before).pop(); s-=ch.length; }
    t.setRangeText('',s,en,'end'); t.dispatchEvent(new InputEvent('input',{bubbles:true,inputType:'deleteContentBackward'}));
  },
  enter(){
    if(this.sink()){ this.extBuf=''; return this.extKey('Return'); }
    const t=this.live(); if(!t) return;
    const ev=new KeyboardEvent('keydown',{key:'Enter',code:'Enter',keyCode:13,which:13,bubbles:true,cancelable:true});
    const ok=t.dispatchEvent(ev);
    if(!ok) return;
    if(t.tagName==='TEXTAREA') return this.type('\n');
    if(t.isContentEditable){ document.execCommand('insertLineBreak'); return; }
    if(t.form){ t.form.requestSubmit?.(); return; }
    this.hide(); t.blur();
  },
  moveCaret(n){
    if(this.sink()){ for(let i=0;i<Math.abs(n);i++) this.sink().key(n>0?'Right':'Left'); return; }
    const t=this.live(); if(!t) return;
    const rtl=getComputedStyle(t).direction==='rtl'||/[\u0600-\u06FF]/.test(t.value||t.textContent||'');
    const step=rtl?-n:n;
    if(t.isContentEditable){ const sel=getSelection(); for(let i=0;i<Math.abs(step);i++) sel.modify('move',step>0?'forward':'backward','character'); return; }
    if(t.type==='number') return;
    const p=clamp((t.selectionStart||0)+step,0,t.value.length); t.setSelectionRange(p,p);
  },
  /* ---------- popups ---------- */
  popShow(b,txt){ if(S.oskPreview===false) return; const p=this.el.querySelector('.osk-pop'), r=b.getBoundingClientRect(), o=this.el.getBoundingClientRect();
    p.textContent=txt; p.hidden=false; p.style.left=(r.left-o.left+r.width/2)+'px'; p.style.top=(r.top-o.top)+'px'; },
  popHide(){ const p=this.el.querySelector('.osk-pop'); if(p) p.hidden=true; },
  openAlt(b,alts){
    const a=this.el.querySelector('.osk-alt'), r=b.getBoundingClientRect(), o=this.el.getBoundingClientRect();
    a.innerHTML=alts.map(x=>`<button class="k" data-okey="${esc(this.shift&&this.lang!=='ar'?x.toUpperCase():x)}">${esc(this.shift&&this.lang!=='ar'?x.toUpperCase():x)}</button>`).join('');
    a.hidden=false; const w=a.offsetWidth;
    a.style.left=clamp(r.left-o.left+r.width/2-w/2,4,o.width-w-4)+'px'; a.style.top=(r.top-o.top-a.offsetHeight-6)+'px';
    // slide finger onto an alternative and release to pick it
    const pick=ev=>{ const el=(this.root||document).elementFromPoint(ev.clientX,ev.clientY); $$('.osk-alt .k',this.el).forEach(k=>k.classList.toggle('hot',k===el)); };
    const rel=ev=>{ removeEventListener('pointermove',pick,true); removeEventListener('pointerup',rel,true); const el=(this.root||document).elementFromPoint(ev.clientX,ev.clientY); if(el&&el.closest('.osk-alt [data-okey]')){ this.type(el.closest('[data-okey]').dataset.okey); this.closeAlt(); } };
    addEventListener('pointermove',pick,true); addEventListener('pointerup',rel,true);
  },
  closeAlt(){ const a=this.el&&this.el.querySelector('.osk-alt'); if(a) a.hidden=true; }
};
ICONS.backspace='<path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="m12 9 6 6M18 9l-6 6"/>';
ICONS.shiftKey='<path d="M12 3 3 12h5v8h8v-8h5z"/>';
ICONS.enterKey='<path d="M20 5v7a3 3 0 0 1-3 3H5"/><path d="m9 11-4 4 4 4"/>';
ICONS.keyboard='<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/>';
ICONS.keyboardOff='<rect x="2" y="6" width="20" height="12" rx="2" opacity=".45"/><path d="M3 3l18 18"/>';
ICONS.terminal='<rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/>';

</script>
<script>
"use strict";
/* =====================================================================
   ريموت المعلم — صفحة تشتغل على Raspberry Pi Zero 2 W ويا شاشة 5 إنج
   ===================================================================== */
const R={
  rot:0, agent:null, src:'board', upath:'', ufiles:null, tok:'', st:{}, v:0, online:false, tab:'home', path:'', files:null, tasks:[], color:'#111827', pen:'pen', ptrMode:'laser',
  q:[], sending:false, lastNote:0, idleT:0,
  async api(p,body){
    const o={method:body?'POST':'GET',headers:{'X-Remote-Token':this.tok}};
    if(body){ o.headers['Content-Type']='application/json'; o.body=JSON.stringify(body); }
    const r=await fetch(p,o); if(r.status===401){ this.unpair(); throw new Error('unpaired'); }
    const j=await r.json(); if(!r.ok) throw new Error(j.error||r.status); return j;
  },
  toast(t){ const el=$('#toast'); el.textContent=t; el.hidden=false; clearTimeout(this.tt); this.tt=setTimeout(()=>el.hidden=true,2200); },
  init(){
    try{ this.tok=localStorage.getItem('alhRemoteTok')||''; }catch(e){}
    // سكربت التجهيز يربط الريموت ويحط المفتاح بالرابط (?k=…) — يشتغل حتى لو المتصفح ما يحفظ شي
    const qk=new URLSearchParams(location.search).get('k'); if(qk){ this.tok=qk; try{ localStorage.setItem('alhRemoteTok',qk); }catch(e){} }
    Keyboard.init();
    paintIcons(document);
    // اتجاه الشاشة: أفقي ← عمودي ← عمودي (الجهة الثانية)
    try{ const r=+localStorage.getItem('alhRemoteRot'); if(r===90||r===270) this.setRot(r,true); }catch(e){}
    $('#rotBtn').onclick=$('#pairRot').onclick=()=>this.cycleRot();
    $('#micInd').onclick=()=>this.toggleListen();
    $('#nav').addEventListener('click',e=>{ const b=e.target.closest('[data-go]'); if(b) this.show(b.dataset.go); });
    addEventListener('pointerdown',()=>this.wake(),true);
    setInterval(()=>this.clock(),1000); this.clock();
    if(this.tok) this.start(); else this.pairUI();
  },
  /* ---------- الربط ---------- */
  pairUI(){
    $('#app').hidden=true; $('#pair').hidden=false; let pin='';
    const draw=()=>{ $('#pins').innerHTML=[0,1,2,3,4,5].map(i=>`<i class="${i===pin.length?'cur':''}">${pin[i]||''}</i>`).join(''); };
    $('#num').innerHTML=['1','2','3','4','5','6','7','8','9','⌫','0','✓'].map(k=>`<button data-k="${k}" class="${k==='✓'?'ok':''}">${k}</button>`).join('');
    $('#num').onclick=async e=>{ const b=e.target.closest('[data-k]'); if(!b) return; const k=b.dataset.k;
      if(k==='⌫') pin=pin.slice(0,-1); else if(k==='✓'||pin.length===5){ if(k!=='✓') pin+=k; draw(); if(pin.length===6) await this.pair(pin); pin=''; }
      else pin+=k; draw(); };
    draw();
  },
  async pair(pin){
    $('#pairErr').textContent='';
    try{ const r=await fetch('/api/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin,name:'ريموت المعلم'})});
      const j=await r.json(); if(!r.ok) throw new Error(j.error||'تعذر الربط');
      this.tok=j.token; try{ localStorage.setItem('alhRemoteTok',j.token); }catch(e){}
      $('#pair').hidden=true; this.start(); this.toast('تم الربط ✓');
    }catch(e){ $('#pairErr').textContent=e.message; }
  },
  unpair(){ this.tok=''; try{ localStorage.removeItem('alhRemoteTok'); }catch(e){} this.pairUI(); },
  /* ---------- الحالة ---------- */
  start(){ $('#pair').hidden=true; $('#app').hidden=false; this.show('home'); this.loop(); this.loadTasks(); this.loadPrefs(); this.probeAgent(); setInterval(()=>this.probeAgent(),15000); },
  /* ---------- المساعد المحلي بالريموت (المايك + الفلاشة) على 127.0.0.1:8771 ---------- */
  AG:'http://127.0.0.1:8771',
  async ag(p,body,ms=8000){
    const c=new AbortController(), t=setTimeout(()=>c.abort(),ms);
    try{ const o=body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:c.signal}:{signal:c.signal};
      const r=await fetch(this.AG+p,o); const j=await r.json(); if(j&&j.error) throw new Error(j.error); return j; }
    finally{ clearTimeout(t); }
  },
  async probeAgent(){
    const was=JSON.stringify(this.agent);
    try{ this.agent=await this.ag('/hello',null,1500); }catch(e){ this.agent=null; }
    if(!this.lsT) this.listenTick();
    if(JSON.stringify(this.agent)!==was&&this.tab==='home') this.renderHome();
  },
  feat(k){ const f=this.st.feat; return !f||f[k]!==false; },
  async loadPrefs(){ try{ const p=await this.api('/api/prefs'); if(p&&[0,90,270].includes(p.rot)&&p.rot!==this.rot) this.setRot(p.rot,true); }catch(e){} },
  setRot(r,silent){
    this.rot=r; const h=document.documentElement; if(r) h.dataset.rot=r; else delete h.dataset.rot;
    try{ localStorage.setItem('alhRemoteRot',r); }catch(e){}
    requestAnimationFrame(()=>{ this.fitPad(); Keyboard.fit&&Keyboard.fit(); });
    if(silent) return;
    this.toast(r===0?'الشاشة: أفقي':r===90?'الشاشة: عمودي':'الشاشة: عمودي (الجهة الثانية)');
    if(this.tok) this.api('/api/prefs',{rot:r}).catch(()=>{});
  },
  cycleRot(){ this.setRot({0:90,90:270,270:0}[this.rot]||0); },
  async loop(){
    while(this.tok){
      try{ const r=await this.api('/api/state?v='+this.v+'&wait=15'); this.online=!!r.board; if(r.v!==this.v){ this.v=r.v; this.st=r.state||{}; this.onState(); } }
      catch(e){ this.online=false; if(e.message==='unpaired') return; await new Promise(r=>setTimeout(r,2000)); }
      $('#dot').classList.toggle('on',this.online);
    }
  },
  onState(){
    const s=this.st; $('#scr').textContent=s.title||'';
    if(s.note&&s.note.t>this.lastNote){ this.lastNote=s.note.t; if(Date.now()/1000-s.note.t<60) this.notify(s.note.text); }
    if(s.tasksV&&s.tasksV!==this.tasksV){ this.tasksV=s.tasksV; this.loadTasks(); }
    if(this.tab==='home') this.renderHome();
    if(this.tab==='write'||this.tab==='ptr') this.fitPad();
    this.lesson();
  },
  lesson(){
    const L=this.st.lesson, el=$('#les'); if(!L||!L.end){ el.hidden=true; return; }
    const left=Math.round(L.end-Date.now()/1000); if(left<=0){ el.hidden=true; return; }
    el.hidden=false; el.classList.toggle('warn',left<=300);
    el.textContent=`${L.subj||'الحصة'} · ${nf(Math.floor(left/60))}:${nf(String(left%60).padStart(2,'0'))}`;
  },
  clock(){ const d=new Date(); $('#clk').textContent=nf(d.getHours()%12||12)+':'+nf(String(d.getMinutes()).padStart(2,'0')); this.lesson(); },
  notify(text){
    const n=$('#note'); n.innerHTML=`<svg class="i" style="font-size:54px" data-i="bell"></svg><b>${esc(text)}</b><span>المس الشاشة للإغلاق</span>`; paintIcons(n); n.hidden=false;
    let k=0; const fl=setInterval(()=>{ n.style.background=(k++%2)?'rgba(124,45,18,.94)':'rgba(194,65,12,.96)'; if(k>9) clearInterval(fl); },300);
    n.onclick=()=>{ n.hidden=true; clearInterval(fl); };
    try{ const ac=new AudioContext(), o=ac.createOscillator(), g=ac.createGain(); o.frequency.value=880; o.connect(g); g.connect(ac.destination); g.gain.setValueAtTime(.2,ac.currentTime); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.6); o.start(); o.stop(ac.currentTime+.6); }catch(e){}
  },
  /* سطوع: الشاشة تخفت بعد دقيقتين بدون لمس — توفير بطارية */
  wake(){ $('#dim').style.opacity=0; clearTimeout(this.idleT); this.idleT=setTimeout(()=>{ $('#dim').style.opacity=.7; },120e3); },
  /* ---------- الأوامر ---------- */
  cmd(o){ this.q.push(o); this.flush(); },
  async flush(){
    if(this.sending||!this.q.length) return; this.sending=true;
    const batch=this.q.splice(0,50);
    try{ await this.api('/api/cmd',{cmds:batch}); }catch(e){ if(e.message!=='unpaired') this.toast('الصبورة ما ترد — تأكد من الشبكة'); }
    this.sending=false; if(this.q.length) setTimeout(()=>this.flush(),0);
  },
  show(t){
    this.tab=t; $$('#nav [data-go]').forEach(b=>b.classList.toggle('on',b.dataset.go===t));
    $$('main .tab').forEach(s=>s.hidden=s.dataset.tab!==t);
    if(t==='home') this.renderHome();
    if(t==='write') this.renderWrite();
    if(t==='ptr') this.renderPtr();
    if(t==='files'){ if(this.src==='usb') this.loadUsb(this.upath); else this.loadFiles(this.path); }
    if(t==='tasks') this.renderTasks();
    Keyboard.hide&&Keyboard.hide();
  },
  /* ---------- الرئيسية ---------- */
  renderHome(){
    const s=this.st, pk=s.picked||{}, pg=s.page||{}, el=$('[data-tab=home]');
    const pgTxt=pg.total?`${pg.kind==='pdf'?'صفحة':pg.kind==='slides'?'شريحة':'صفحة السبورة'} ${nf(pg.cur)} من ${nf(pg.total)}`:'';
    const voiceOn=this.feat('voice')&&!!(this.agent&&this.agent.mic), usbOn=this.feat('usb');
    el.innerHTML=`<div class="grid">
      <button class="tile pick" data-c="pick"><span class="dice"><svg class="i" data-i="dice"></svg></span><span class="nm">${pk.name?esc(pk.name):'القرعة'}<small>${pk.name?`باقي ${nf(pk.left)} من ${nf(pk.total)}`:'اختيار طالب عشوائي — بدون تكرار'}</small></span></button>
      <button class="tile voice${voiceOn?'':' hide'}" data-c="voice"></button>
      <button class="tile acc" data-c="board"><svg class="i" data-i="board"></svg>السبورة</button>
      <button class="tile" data-c="prev"><svg class="i" data-i="chevR"></svg>السابق</button>
      <button class="tile" data-c="next"><svg class="i" data-i="chevL"></svg>التالي</button>
      <button class="tile" data-c="${s.locked?'unlock':'lock'}"><svg class="i" data-i="${s.locked?'unlock':'lock'}"></svg>${s.locked?'فتح القفل':'قفل الشاشة'}</button>
      <button class="tile" data-c="role"><svg class="i" data-i="users"></svg>${esc(s.roleName||'المستخدم')}</button>
      <button class="tile" data-c="curtain"><svg class="i" data-i="curtain"></svg>${s.curtain?'كشف الستارة':'ستارة'}</button>
      <button class="tile" data-c="undo"><svg class="i" data-i="undo"></svg>تراجع</button>
      <button class="tile" data-c="redo"><svg class="i" data-i="redo"></svg>إعادة</button>
      <button class="tile" data-c="pickReset"><svg class="i" data-i="restart"></svg>تصفير القرعة</button>
      <button class="tile hz wide" data-c="home"><svg class="i" data-i="home"></svg>الشاشة الرئيسية</button>
      <button class="tile hz wide${usbOn?'':' hide'}" data-c="usb"><svg class="i" data-i="flash"></svg>فلاشة الريموت ← الصبورة</button>
    </div>${pgTxt?`<div class="pgline" style="position:absolute;bottom:2px;left:14px">${pgTxt}</div>`:''}`;
    paintIcons(el); this.paintListen();
    el.onclick=e=>{ const b=e.target.closest('[data-c]'); if(!b) return; const c=b.dataset.c;
      if(c==='role') return this.roleBox();
      if(c==='unlock') return this.unlockBox();
      if(c==='voice') return this.toggleListen();
      if(c==='usb'){ this.src='usb'; this.upath=''; return this.show('files'); }
      this.cmd({a:c}); if(c==='pick') b.querySelector('.nm').firstChild.textContent='…'; };
  },
  roleBox(){
    const cur=this.st.role||'teacher'; let sel=cur;
    const ov=document.createElement('div'); ov.className='ov';
    ov.innerHTML=`<div class="box"><h2>تبديل المستخدم</h2><p>إذا المستخدم مقفل بكلمة مرور اكتبها تحت.</p>
      <div class="roles">${[['student','الطالب'],['teacher','الأستاذ'],['dev','المطوّر']].map(([k,n])=>`<button data-r="${k}" class="${k===cur?'on':''}"><svg class="i" data-i="users"></svg>${n}</button>`).join('')}</div>
      <div style="display:flex;gap:8px"><input class="field" id="rPw" type="password" placeholder="كلمة المرور (إذا موجودة)"></div>
      <div class="err" id="rErr"></div>
      <div class="btns"><button class="btn" data-b="x">إلغاء</button><button class="btn pri" data-b="ok"><svg class="i" data-i="check"></svg>تبديل</button></div></div>`;
    document.body.appendChild(ov); paintIcons(ov);
    ov.onclick=async e=>{ const r=e.target.closest('[data-r]'); if(r){ sel=r.dataset.r; $$('[data-r]',ov).forEach(x=>x.classList.toggle('on',x===r)); return; }
      const b=e.target.closest('[data-b]'); if(!b) return; if(b.dataset.b==='x'){ Keyboard.hide(); ov.remove(); return; }
      this.cmd({a:'role',k:sel,pw:$('#rPw',ov).value}); Keyboard.hide(); ov.remove(); this.toast('تم الإرسال للصبورة'); };
  },
  unlockBox(){
    if(!this.st.lockPw){ this.cmd({a:'unlock'}); return; }
    const ov=document.createElement('div'); ov.className='ov';
    ov.innerHTML=`<div class="box"><h2>فتح القفل</h2><p>اكتب كلمة مرور ${esc(this.st.roleName||'المستخدم')}</p>
      <input class="field" id="uPw" type="password" placeholder="كلمة المرور" style="width:100%">
      <div class="btns"><button class="btn" data-b="x">إلغاء</button><button class="btn pri" data-b="ok"><svg class="i" data-i="unlock"></svg>فتح</button></div></div>`;
    document.body.appendChild(ov); paintIcons(ov); setTimeout(()=>$('#uPw',ov).focus(),50);
    ov.onclick=e=>{ const b=e.target.closest('[data-b]'); if(!b) return; if(b.dataset.b==='ok') this.cmd({a:'unlock',pw:$('#uPw',ov).value}); Keyboard.hide(); ov.remove(); };
  },
  /* ---------- الكتابة من الريموت ---------- */
  renderWrite(){
    const el=$('[data-tab=write]'), cols=['#111827','#2563eb','#dc2626','#16a34a','#f0703e','#ffffff'];
    el.innerHTML=`<div class="side">${cols.map(c=>`<button data-col="${c}" class="${c===this.color?'on':''}"><span class="sw" style="background:${c}"></span></button>`).join('')}
      <button data-w="hl" class="${this.pen==='hl'?'on':''}"><svg class="i" data-i="marker"></svg></button>
      <button data-w="undo"><svg class="i" data-i="undo"></svg></button>
      <button data-w="newpage"><svg class="i" data-i="pageNew"></svg></button></div>
      <div class="padwrap"><div class="pad" id="wPad"><canvas id="wCv"></canvas><div class="hint" id="wHint">اكتب هنا — الكتابة تطلع على الصبورة</div></div></div>`;
    paintIcons(el);
    el.querySelector('.side').onclick=e=>{ const c=e.target.closest('[data-col]'); if(c){ this.color=c.dataset.col; if(this.pen==='hl') this.pen='pen'; this.renderWrite(); return; }
      const w=e.target.closest('[data-w]'); if(!w) return; const a=w.dataset.w;
      if(a==='hl'){ this.pen=this.pen==='hl'?'pen':'hl'; this.renderWrite(); return; }
      if(a==='undo') this.cmd({a:'undo'}); if(a==='newpage'){ this.cmd({a:'newpage'}); this.clearPad(); } };
    this.fitPad(); this.bindPad($('#wPad'),'ink');
  },
  renderPtr(){
    const el=$('[data-tab=ptr]');
    el.innerHTML=`<div class="side"><button data-m="laser" class="${this.ptrMode==='laser'?'on':''}"><svg class="i" data-i="laser"></svg></button>
      <button data-m="prev"><svg class="i" data-i="chevR"></svg></button><button data-m="next"><svg class="i" data-i="chevL"></svg></button></div>
      <div class="padwrap"><div class="pad ptr" id="pPad"><div class="hint">حرّك إصبعك هنا — تطلع نقطة ليزر حمرة على الصبورة بنفس المكان</div></div></div>`;
    paintIcons(el);
    el.querySelector('.side').onclick=e=>{ const b=e.target.closest('[data-m]'); if(!b) return; if(b.dataset.m!=='laser') this.cmd({a:b.dataset.m}); };
    this.fitPad(); this.bindPad($('#pPad'),'laser');
  },
  fitPad(){
    for(const id of ['wPad','pPad']){ const p=$('#'+id); if(!p) continue; const box=p.parentElement, ar=this.st.ar||16/9;
      let w=box.clientWidth, h=w/ar; if(h>box.clientHeight){ h=box.clientHeight; w=h*ar; }
      p.style.width=w+'px'; p.style.height=h+'px'; p.classList.toggle('dark',!!this.st.boardDark&&id==='wPad');
      const cv=p.querySelector('canvas'); if(cv&&(cv.width!==Math.round(w*devicePixelRatio))){ cv.width=Math.round(w*devicePixelRatio); cv.height=Math.round(h*devicePixelRatio); } }
  },
  clearPad(){ const cv=$('#wCv'); if(cv) cv.getContext('2d').clearRect(0,0,cv.width,cv.height); },
  bindPad(pad,kind){
    let id=null, last=null, buf=[], lastSend=0;
    const pt=e=>{ const r=pad.getBoundingClientRect(); let x,y,w;      // الشاشة ممكن تكون ملفوفة (عمودي)
      if(this.rot===90){ x=e.clientY-r.top; y=r.right-e.clientX; w=r.height; }
      else if(this.rot===270){ x=r.bottom-e.clientY; y=e.clientX-r.left; w=r.height; }
      else { x=e.clientX-r.left; y=e.clientY-r.top; w=r.width; }
      return [x/w,y/w]; };
    const send=(ph)=>{ if(kind==='ink'){ if(buf.length||ph!=='m') this.cmd({a:'ink',id,ph,pts:buf.splice(0),c:this.color,k:this.pen}); } };
    pad.onpointerdown=e=>{ e.preventDefault(); pad.setPointerCapture(e.pointerId); id=Math.random().toString(36).slice(2,9); last=pt(e);
      const h=$('#wHint'); if(h) h.hidden=true;
      if(kind==='ink'){ buf=[last]; send('s'); } else this.cmd({a:'laser',x:last[0],y:last[1]});
      lastSend=performance.now(); };
    pad.onpointermove=e=>{ if(!id) return; const p=pt(e);
      if(kind==='ink'){ const cv=$('#wCv'); if(cv){ const x=cv.getContext('2d'), W=cv.width; x.strokeStyle=this.color; x.globalAlpha=this.pen==='hl'?.35:1; x.lineWidth=(this.pen==='hl'?16:3.5)*devicePixelRatio; x.lineCap='round'; x.beginPath(); x.moveTo(last[0]*W,last[1]*W); x.lineTo(p[0]*W,p[1]*W); x.stroke(); }
        buf.push(p); if(performance.now()-lastSend>40){ lastSend=performance.now(); send('m'); } }
      else if(performance.now()-lastSend>33){ lastSend=performance.now(); this.cmd({a:'laser',x:p[0],y:p[1]}); }
      last=p; };
    const end=()=>{ if(!id) return; if(kind==='ink') send('e'); else this.cmd({a:'laserEnd'}); id=null; };
    pad.onpointerup=end; pad.onpointercancel=end;
  },
  /* ---------- الملفات ---------- */
  async loadFiles(path){
    const el=$('[data-tab=files]'); el.innerHTML='<div class="empty">جاري التحميل…</div>';
    try{ const r=await this.api('/api/files?path='+encodeURIComponent(path||'')); this.path=r.path; this.files=r; this.renderFiles(); }
    catch(e){ el.innerHTML=`<div class="empty">تعذر جلب الملفات — ${esc(e.message)}</div>`; }
  },
  renderFiles(){
    const r=this.files, el=$('[data-tab=files]'), ic=e=>e.dir?'folder':({pdf:'pdf',pptx:'slides',docx:'word',xlsx:'table',png:'image',jpg:'image',jpeg:'image',webp:'image',board:'board'}[e.ext]||'doc');
    el.innerHTML=`<div class="bar">${this.segHTML()}${r.path?`<button class="btn" data-up="1"><svg class="i" data-i="chevR"></svg>رجوع</button>`:''}<span class="path">${r.path?esc(r.path.split('/').slice(-1)[0]):'المجلدات'}</span></div>
      <div class="list">${r.items.length?r.items.map((e,i)=>`<button class="row" data-i="${i}"><span class="ic"><svg class="i" data-i="${ic(e)}"></svg></span><span class="nm">${e.dir?esc(e.name):fname(e.name)}</span>${e.dir?'':`<small>${fmt(e.size)}</small>`}</button>`).join(''):'<div class="empty">ماكو ملفات هنا</div>'}</div>`;
    paintIcons(el);
    el.onclick=e=>{ if(this.segClick(e)) return; if(e.target.closest('[data-up]')){ this.loadFiles(r.parent||''); return; }
      const b=e.target.closest('.row[data-i]'); if(!b) return; const it=r.items[+b.dataset.i];
      if(it.dir) this.loadFiles(it.path); else { this.cmd({a:'open',path:it.path,name:it.name,ext:it.ext,size:it.size,mtime:it.mtime}); this.toast('جاري فتح '+it.name); } };
  },
  segHTML(){
    if(!this.feat('usb')) return '';
    return `<div class="seg"><button data-src="board" class="${this.src==='board'?'on':''}"><svg class="i" data-i="board"></svg>الصبورة</button><button data-src="usb" class="${this.src==='usb'?'on':''}"><svg class="i" data-i="flash"></svg>الفلاشة</button></div>`;
  },
  segClick(e){ const b=e.target.closest('[data-src]'); if(!b) return false; this.src=b.dataset.src; this.show('files'); return true; },
  /* ---------- فلاشة الريموت ---------- */
  async loadUsb(path){
    const el=$('[data-tab=files]');
    el.innerHTML=`<div class="bar">${this.segHTML()}</div><div class="empty">جاري قراءة الفلاشة…</div>`; paintIcons(el); el.onclick=e=>this.segClick(e);
    if(!this.agent){ await this.probeAgent(); }
    if(!this.agent){ el.querySelector('.empty').innerHTML='برنامج الفلاشة مو شغال بالريموت.<br>أعد تشغيل الريموت، وإذا بقت المشكلة أعد تنصيبه من إعدادات الصبورة ← الريموت.'; return; }
    try{ this.ufiles=await this.ag('/usb/ls?path='+encodeURIComponent(path||''),null,15000); this.upath=this.ufiles.path; this.renderUsb(); }
    catch(e){ el.querySelector('.empty').textContent='تعذر قراءة الفلاشة — '+e.message; }
  },
  renderUsb(){
    const r=this.ufiles, el=$('[data-tab=files]'), ic=e=>e.dir?'folder':({pdf:'pdf',pptx:'slides',docx:'word',xlsx:'table',png:'image',jpg:'image',jpeg:'image',webp:'image',board:'board',mp4:'video'}[e.ext]||'doc');
    el.innerHTML=`<div class="bar">${this.segHTML()}${r.path?`<button class="btn" data-up="1"><svg class="i" data-i="chevR"></svg>رجوع</button>`:''}<span class="path">${r.path?esc(r.path.split('/').slice(-1)[0]):'فلاشات الريموت'}</span>
        ${r.path?'':`<button class="btn" data-ej="1"><svg class="i" data-i="eject"></svg>فصل</button>`}</div>
      <div class="list">${r.items.length?r.items.map((e,i)=>`<button class="row" data-i="${i}"><span class="ic"><svg class="i" data-i="${r.path?ic(e):'flash'}"></svg></span><span class="nm">${e.dir?esc(e.name):fname(e.name)}</span>${e.dir?(e.drive?`<small>${esc(e.drive)}</small>`:''):`<small>${fmt(e.size)}</small>`}</button>`).join('')
        :`<div class="empty">${r.path?'المجلد فارغ':'اشبك فلاشة بالريموت (منفذ USB أو الموزّع)، وانتظر ثواني'}</div>`}</div>`;
    paintIcons(el);
    el.onclick=async e=>{ if(this.segClick(e)) return;
      if(e.target.closest('[data-up]')){ this.loadUsb(r.parent||''); return; }
      if(e.target.closest('[data-ej]')){ try{ await this.ag('/usb/eject',{}); this.toast('تكدر تسحب الفلاشة ✓'); }catch(x){ this.toast(x.message); } return; }
      const b=e.target.closest('.row[data-i]'); if(!b) return; const it=r.items[+b.dataset.i];
      if(it.dir) this.loadUsb(it.path); else this.usbSheet(it); };
    if(!r.path&&!r.items.length){ clearTimeout(this.usbT); this.usbT=setTimeout(()=>{ if(this.tab==='files'&&this.src==='usb'&&!this.upath) this.loadUsb(''); },4000); }
  },
  usbSheet(it){
    const ov=document.createElement('div'); ov.className='ov';
    ov.innerHTML=`<div class="box"><h2 style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${fname(it.name)}</h2><p>${fmt(it.size)} — من فلاشة الريموت</p>
      <div class="sheet"><button class="btn pri" data-s="open"><svg class="i" data-i="send"></svg>انسخه للصبورة وافتحه</button>
      <button class="btn" data-s="copy"><svg class="i" data-i="download"></svg>انسخه للصبورة بس</button>
      <button class="btn" data-s="x">إلغاء</button></div></div>`;
    document.body.appendChild(ov); paintIcons(ov);
    ov.onclick=e=>{ const b=e.target.closest('[data-s]'); if(!b) return; ov.remove(); if(b.dataset.s!=='x') this.usbSend([it.path],b.dataset.s==='open',it.name); };
  },
  async usbSend(paths,open,name){
    let pr=$('#prog'); if(!pr){ pr=document.createElement('div'); pr.id='prog'; pr.className='prog'; document.body.appendChild(pr); }
    pr.hidden=false; pr.innerHTML=`<b>جاري النسخ: ${esc(name||'')}</b><i></i>`;
    let job; try{ job=await this.ag('/usb/send',{paths,open}); }catch(e){ pr.hidden=true; this.toast(e.message); return; }
    const tick=async()=>{
      let j; try{ j=await this.ag('/usb/job?id='+job.id); }catch(e){ j={state:'error',error:e.message}; }
      const p=j.total?Math.round(j.done/j.total*100):0; pr.querySelector('i').style.setProperty('--p',p+'%');
      pr.querySelector('b').textContent=j.state==='run'?`جاري النسخ ${nf(p)}٪ — ${j.name||''}`:'';
      if(j.state==='run') return setTimeout(tick,500);
      pr.hidden=true;
      if(j.state==='ok') this.toast(open?'انفتح على الصبورة ✓':'انحفظ بالصبورة ← المستندات ← من الريموت ✓'); else this.toast('فشل النسخ: '+(j.error||''));
    };
    tick();
  },
  /* ---------- الاستماع المستمر: الكلام يطلع نص على الصبورة بدون زر ---------- */
  listenPref(){ try{ return localStorage.getItem('alhListen')!=='0'; }catch(e){ return true; } },
  async listenTick(){
    clearTimeout(this.lsT);
    if(this.agent&&this.agent.mic){
      try{
        let st=await this.ag('/listen',null,1500);
        const want=this.feat('voice')&&this.listenPref();
        if(st.on!==want) st=await this.ag('/listen',{on:want},3000);
        this.ls=st;
      }catch(e){ this.ls=null; }
    } else this.ls=null;
    this.paintListen();
    this.lsT=setTimeout(()=>this.listenTick(),this.ls&&this.ls.on?700:3000);
  },
  toggleListen(){
    const on=!this.listenPref(); try{ localStorage.setItem('alhListen',on?'1':'0'); }catch(e){}
    this.toast(on?'المايك شغّال — الكلام يطلع نص على الصبورة':'المايك متوقف'); this.listenTick();
  },
  paintListen(){
    const L=this.ls, b=$('#micInd'), show=!!(L&&this.feat('voice'));
    if(b){ b.hidden=!show; b.className='rotb mic '+(!L||!L.on?'off':L.state==='speech'?'speech':L.state==='nomic'?'off':'on');
      b.innerHTML=icon(L&&L.on?'mic':'micOff'); }
    const t=$('[data-c=voice]'); if(!t) return;
    const lbl=!L?'المايك مو موصول':!L.on?'المايك متوقف — المس حتى يشتغل':L.state==='nomic'?'اشبك المايك USB':L.state==='speech'?'يسمع… 🎙':'المايك يسمع — تكلّم';
    const last=L&&L.last&&L.last.length?L.last[L.last.length-1]:'';
    t.classList.toggle('dis',!L); t.classList.toggle('live',!!(L&&L.on&&L.state==='speech')); t.classList.toggle('paused',!!(L&&!L.on));
    t.innerHTML=`${icon(L&&L.on?'mic':'micOff')}<span>${esc(lbl)}</span>${last&&L.on?`<small class="vlast">${esc(last)}</small>`:''}`;
  },
  /* ---------- مهام المعلم ---------- */
  async loadTasks(){ try{ const r=await this.api('/api/tasks'); this.tasks=r.items||[]; if(this.tab==='tasks') this.renderTasks(); }catch(e){} },
  async taskOp(o){ try{ const r=await this.api('/api/tasks',o); this.tasks=r.items; this.renderTasks(); }catch(e){ this.toast('تعذر الحفظ'); } },
  renderTasks(){
    const el=$('[data-tab=tasks]'), open=this.tasks.filter(t=>!t.done).length;
    el.innerHTML=`<div class="bar"><input class="field" id="tIn" type="text" placeholder="مهمة جديدة… مثلاً: صحح دفاتر الثالث ج"><button class="btn pri" data-t="add"><svg class="i" data-i="plus"></svg>إضافة</button></div>
      <div class="list">${this.tasks.length?this.tasks.map(t=>`<div class="row${t.done?' done':''}"><button class="chk" data-t="toggle" data-id="${t.id}">${t.done?'<svg class="i" data-i="check"></svg>':''}</button><span class="nm">${esc(t.text)}</span><button class="ic" data-t="del" data-id="${t.id}"><svg class="i" data-i="trash"></svg></button></div>`).join(''):'<div class="empty">ماكو مهام — اكتب مهمة فوك</div>'}</div>
      ${this.tasks.some(t=>t.done)?`<div class="btns"><button class="btn" data-t="clearDone">مسح المنجزة</button></div>`:''}<p class="pgline">${nf(open)} مهمة باقية</p>`;
    paintIcons(el);
    const add=()=>{ const v=$('#tIn').value.trim(); if(v){ Keyboard.hide(); this.taskOp({op:'add',text:v}); } };
    $('#tIn').onkeydown=e=>{ if(e.key==='Enter') add(); };
    el.onclick=e=>{ const b=e.target.closest('[data-t]'); if(!b) return; const a=b.dataset.t; if(a==='add') add(); else this.taskOp({op:a,id:b.dataset.id}); };
  }
};
/* اسم الملف: الامتداد (.pdf) يبقى بمكانه حتى لو الاسم عربي */
const fname=n=>{ const m=String(n).match(/^(.*?)(\.[A-Za-z0-9]{1,5})$/); return m&&m[1]?`${esc(m[1])}<bdi dir="ltr">${esc(m[2])}</bdi>`:esc(n); };
const fmt=b=>b<1e3?b+' B':b<1e6?(b/1e3).toFixed(0)+' KB':(b/1e6).toFixed(1)+' MB';
addEventListener('resize',()=>R.fitPad());
R.init();
</script>
</body>
